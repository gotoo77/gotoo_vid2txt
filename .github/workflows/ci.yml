name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Ensure lockfile is committed
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit and injected integration tests
        run: cargo test --locked --all-targets
      - name: Clippy (block warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Linux mocked end-to-end CLI tests
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release
          bash scripts/qa_cli_linux.sh "$(pwd)/target/release/gotoo-vid2txt"

  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build
