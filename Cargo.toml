[package]
name = "gotoo-vid2txt"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "Extensible, local-first video to transcript pipeline"
license = "MIT"
repository = "https://github.com/gotoo77/gotoo_vid2txt"
readme = "README.md"
keywords = ["transcription", "video", "whisper", "speech-to-text"]
categories = ["command-line-utilities", "multimedia"]

[lib]
name = "gotoo_vid2txt"
path = "src/lib.rs"

[[bin]]
name = "gotoo-vid2txt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "config"
harness = false
