name: Temporary caption validation and rustfmt bootstrap
on:
  push:
    branches:
      - feat/youtube-captions-first
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Mandatory format
        run: cargo fmt --all -- --check
      - name: Mandatory check
        run: cargo check --locked --all-targets
      - name: Mandatory tests
        run: cargo test --locked --all-targets
      - name: Mandatory Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Mandatory rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Mandatory mocked integration tests
        run: |
          cargo build --locked --release
          bash scripts/qa_cli_linux.sh "$(pwd)/target/release/gotoo-vid2txt"
          bash scripts/qa_captions_linux.sh "$(pwd)/target/release/gotoo-vid2txt"
      - name: Commit formatted code only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u src tests benches
          if ! git diff --cached --quiet; then
            git commit -m "style: apply rustfmt to captions implementation"
            git push origin HEAD:feat/youtube-captions-first
          fi
